<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body style="font:14px -apple-system,sans-serif;color:#25352f;padding:12px">
<h1>准备好 Mac，开始远程说话。</h1>
<p>这个安装器会把 <b>MicBridge 接收器</b>放进“应用程序”，并在缺少时安装 <b>BlackHole 2ch</b> 虚拟声卡。</p>
<p>已经安装 BlackHole 2ch 时会自动跳过，不覆盖原有声卡。</p>
<p>首次安装声卡可能需要重启。安装器会按实际选择显示提示，请先保存工作，再选择方便的时间安装。</p>
<p>MicBridge 使用 <b>UU 远程 → 端口直连</b>传送声音。安装后还需在 UU 中开启一次 TCP 18768 映射。</p>
</body></html>
