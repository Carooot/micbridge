<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body style="font:14px -apple-system,sans-serif;color:#25352f;padding:12px">
<h1>Mac 端已经准备好了。</h1>
<p>如果下方提示重启，请先按提示重启，让声卡加载。</p>
<ol><li>在“应用程序”打开 <b>MicBridge</b>，点一次“<b>设为语音输入</b>”。</li>
<li>Windows 的 UU 远程开启端口直连：目标 <b>127.0.0.1:18768</b>，本地端口 <b>18768</b>，协议 <b>TCP</b>。</li>
<li>Windows 打开 MicBridge，点“<b>连接 Mac</b>”，照常使用 Mac 的语音输入。</li></ol>
<p>不需要 Homebrew、终端命令或另外搜索声卡安装包。之后直接打开两端程序即可。</p>
</body></html>
