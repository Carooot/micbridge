name: Publish verified MicBridge 1.2.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.2.2.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a7737c87a28f4f6caafddc024bc57e338d32c3f2
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm old version reproduces the width collapse and fixed version passes
        shell: python
        run: |
          import pathlib,subprocess,sys
          path=pathlib.Path('src/windows/Settings.cs')
          path.write_bytes(subprocess.check_output(['git','show','HEAD^:src/windows/Settings.cs']))
          before=subprocess.run([sys.executable,'tests/layout.py'],capture_output=True,text=True)
          print(before.stdout)
          print(before.stderr)
          assert before.returncode != 0 and 'window width collapsed' in before.stdout, 'Old version must reproduce the reported collapse'
          subprocess.run(['git','restore','src/windows/Settings.cs'],check=True)
          subprocess.run([sys.executable,'tests/layout.py'],check=True)
  publish:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify source and completed build
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/38406382878 --jq .head_sha)" = "a7737c87a28f4f6caafddc024bc57e338d32c3f2"
          test "$(gh api repos/$GH_REPO/actions/runs/38406382878 --jq .conclusion)" = "success"
      - uses: actions/download-artifact@v4
        with:
          run-id: 38406382878
          github-token: ${{ github.token }}
          pattern: MicBridge-*
          path: artifacts
          merge-multiple: true
      - name: Create release and attach tested packages
        run: |
          cat > notes.md <<'NOTES'
          修复 Windows 窗口最小化后恢复变成窄条、右侧内容被截断的问题。主窗口、设置和连接帮助共用修复后的尺寸计算；版本号和程序位置显示也包含在本版中。

          **已有用户只需更新 Windows，Mac 1.1 / 1.2 接收器兼容，无需重装 BlackHole。**

          - [下载 Windows 版](https://github.com/Carooot/micbridge/releases/download/v1.2.2/MicBridge-Windows-x64.zip)
          - [首次使用：下载整套包](https://github.com/Carooot/micbridge/releases/download/v1.2.2/MicBridge-Setup.zip)
          - [Mac 整合安装器](https://github.com/Carooot/micbridge/releases/download/v1.2.2/MicBridge-Mac-Setup.pkg)

          Windows 更新：从托盘退出旧版，解压新版，打开 MicBridge.exe，确认主窗口显示 v1.2.2。UU 远程 TCP 端口继续使用 18768，麦克风联动、锁屏和休眠行为保持不变。

          验证：Windows 原生测试覆盖三个窗口、100% / 125% / 150% / 200% 布局缩放、反复最小化恢复、锁屏提示和托盘恢复；旧代码复现变窄、新代码通过。Windows / Mac 构建、协议测试、Mac 首次安装及已有 BlackHole 跳过检查、整套包校验均通过。

          新安装 Mac 时仍需系统管理员授权，首次安装 BlackHole 按提示重启。MicBridge 整合包尚未 Apple 公证。BlackHole 许可与对应源码随安装包和发布附件提供。
          NOTES
          gh release view v1.2.2 >/dev/null 2>&1 || gh release create v1.2.2 --target a7737c87a28f4f6caafddc024bc57e338d32c3f2 --title "MicBridge 1.2.2 · 修复窗口最小化后变窄" --notes-file notes.md --latest
          test "$(gh api repos/$GH_REPO/git/ref/tags/v1.2.2 --jq .object.sha)" = "a7737c87a28f4f6caafddc024bc57e338d32c3f2"
          gh release upload v1.2.2 artifacts/* --clobber
