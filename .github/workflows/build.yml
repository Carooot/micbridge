name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build universal app and test protocol
        run: python3 scripts/build.py mac
      - name: Exercise real TCP protocol without audio hardware
        run: python3 tests/integration.py
      - name: Package
        run: python3 scripts/package.py mac
      - name: Build combined Mac installer
        run: python3 scripts/mac_installer.py
      - name: Verify and install on disposable runner
        run: python3 tests/installer.py --install
      - uses: actions/upload-artifact@v4
        with:
          name: MicBridge-macOS
          path: dist/*
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build sender and test queue and protocol
        run: python scripts/build.py windows
      - name: Package
        run: python scripts/package.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: MicBridge-Windows
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-previews
          path: build/windows/preview/*.png
  bundle:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: MicBridge-*
          path: artifacts
          merge-multiple: true
      - name: Build one-download setup bundle
        run: python3 scripts/bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: MicBridge-Setup
          path: dist/*
  publish:
    if: github.event_name == 'release'
    needs: [bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MicBridge-*
          path: artifacts
          merge-multiple: true
      - name: Attach tested packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber
